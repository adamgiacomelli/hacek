[package]
name = "hacek"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/adamgiacomelli/hacek"
readme = "README.md"
description = "Hold a letter, get its accented variants: a press-and-hold accent menu for Wayland"
keywords = ["wayland", "accents", "diacritics", "input-method", "keyboard"]

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = "0.9"
unicode-normalization = "0.1"
pangocairo = "0.22"
pango = "0.22"
cairo-rs = "0.22"
rustix = { version = "1", features = ["event", "fs", "mm"] }

[package.metadata.deb]
maintainer = "Adam Giacomelli <8747447+adamgiacomelli@users.noreply.github.com>"
section = "utils"
depends = "$auto, xkb-data"
assets = [
    ["target/release/hacek", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/hacek/", "644"],
]
