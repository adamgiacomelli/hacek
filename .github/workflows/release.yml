name: Release
on:
  push:
    tags: ['v*']
  # Build the Arch package for a release that exists
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpango1.0-dev libcairo2-dev libxkbcommon-dev xkb-data dpkg-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check that the tag matches the version
        run: grep -qx "version = \"${TAG#v}\"" Cargo.toml
      - run: cargo test --locked
      - run: cargo install cargo-deb --locked
      - run: cargo deb --locked
      - name: Try the package
        run: |
          dpkg-deb --info target/debian/*.deb
          sudo apt-get install -y ./target/debian/*.deb
          test "$(hacek --layout si --list | wc -l)" = 4
      - run: gh release create "$TAG" --title "hacek $TAG" --generate-notes target/debian/*.deb

  arch:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git github-cli pacman-contrib rust pango cairo libxkbcommon xkeyboard-config
      - uses: actions/checkout@v4
      - name: Build
        run: |
          useradd -m builder
          install -d -o builder /home/builder/pkg
          install -o builder -m644 packaging/arch/PKGBUILD /home/builder/pkg
          cd /home/builder/pkg
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^options=.*/options=(!lto !debug)/" PKGBUILD
          runuser -u builder -- updpkgsums
          runuser -u builder -- makepkg
      - name: Try the package
        run: |
          pacman -U --noconfirm /home/builder/pkg/hacek-*.pkg.tar.zst
          test "$(hacek --layout si --list | wc -l)" = 4
      - run: gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" /home/builder/pkg/hacek-*.pkg.tar.zst
